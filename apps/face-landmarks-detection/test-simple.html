<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test Simple</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    .container { max-width: 600px; margin: 0 auto; }
    .btn { padding: 0.5rem 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Test TensorFlow.js Basique</h1>
    <button class="btn" id="testBtn">Tester TF.js</button>
    <div id="result" style="margin-top: 2rem; padding: 1rem; background: #f5f5f7; border-radius: 8;"></div>
  </div>

  <script type="module">
    import * as tf from '@tensorflow/tfjs';
    
    document.getElementById('testBtn').addEventListener('click', async () => {
      try {
        // Vérifier la version
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = 'Chargement TensorFlow.js v' + tf.version;
        
        // Tester le backend
        await tf.setBackend('webgl');
        resultDiv.innerHTML += '<br>Backend WebGL OK';
      } catch (e) {
        document.getElementById('result').innerHTML = 'Erreur: ' + e.message;
        console.error(e);
      }
    });
  </script>
</body>
</html>
