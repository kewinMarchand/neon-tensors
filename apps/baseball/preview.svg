<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Neon Baseball Tensor</title>
  <desc id="desc">Classification de lancers MLB par réseau de neurones</desc>
